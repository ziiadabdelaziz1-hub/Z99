<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7FF3F"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>
    <filter id="subtleNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Z9 Symbol -->
  <g transform="translate(10, 10)">
    <!-- Polygon Z -->
    <path d="M5 15 L45 15 L18 55 L50 55 L47 65 L5 65 L32 25 L5 25 Z" fill="#F5F5F2"/>
    <!-- Polygon 9 / Accent Loop -->
    <path d="M48 15 C62 15 72 25 72 40 C72 55 60 65 46 65 L44 65 L52 55 C58 55 63 50 63 40 C63 30 56 25 48 25 L40 25 L45 15 Z" fill="url(#limeGlow)" filter="url(#subtleNeon)"/>
    <circle cx="56" cy="38" r="4.5" fill="#D7FF3F"/>
    <!-- Slash dynamic accent -->
    <polygon points="76,15 80,15 70,65 66,65" fill="#2B2B2B"/>
  </g>

  <!-- Typography Z9 CREATIVE STUDIO -->
  <g transform="translate(110, 58)">
    <text font-family="'Archivo Black', 'Montserrat', sans-serif" font-weight="900" font-size="44" letter-spacing="0.08em" fill="#F5F5F2">Z9</text>
    <text x="75" y="-18" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" letter-spacing="0.32em" fill="#D7FF3F">CREATIVE STUDIO</text>
    <text x="75" y="0" font-family="'Montserrat', sans-serif" font-weight="500" font-size="9" letter-spacing="0.22em" fill="#8E8E8E">IMMERSIVE EXPERIENCES &amp; PROJECTION MAPPING</text>
  </g>
</svg>
